<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<title>Crafts from Hands — Handmade Woven Crafts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= CINEMATIC THEME — Crafts from Hands =================
   Deep burgundy stage, cream type, Pakistan green + gold accents.
   Display: Bebas Neue. Text/UI: Montserrat. Accent italic: Cormorant Garamond. */
:root{
  --bg:#2E0813; --bg2:#3D0E1B; --card:#3A0D1C; --card2:#481527;
  --ink:#E8DFD8; --ink2:#CDB4A4; --ink3:#B08E7E;
  --line:#571E31; --line2:#6E2A40;
  --terra:#35C26B; --terra-d:#2AA657; --terra-deep:#0E5C2E;
  --sage:#7FB98A; --gold:#D4AF37; --gold2:#C99E5D; --goldsoft:#F3DBB3;
  --teal:#4CC2B2; --shadow:0 24px 54px rgba(0,0,0,.55);
  --radius:10px; --nav:rgba(40,6,16,.88);
  --ease:cubic-bezier(.22,.9,.28,1); --ease-out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.45,.64,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:92px;background:#1E040B}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;font-size:15.5px;font-weight:300;line-height:1.65;letter-spacing:.01em;overflow-x:hidden}
::selection{background:var(--gold);color:#14100A}
h1,h2,h3,.serif{font-family:"Bebas Neue","Arial Narrow",sans-serif;font-weight:400;line-height:.95;margin:0;letter-spacing:.015em;text-transform:uppercase}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
a{color:var(--gold2)}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
.grad-cream{display:block;background:linear-gradient(to bottom,#FFFFFF 0%,#D5CBC0 55%,#6E5F4F 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(0,0,0,.85))}
.grad-gold{display:block;background:linear-gradient(to bottom,#F7E7C4 0%,#C99E5D 55%,#543B1A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 25px rgba(201,158,93,.30))}
.grad-green{display:block;background:linear-gradient(to bottom,#D9F5E2 0%,#35C26B 55%,#0B3D20 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 25px rgba(53,194,107,.28))}
.eyebrow{display:flex;align-items:center;gap:16px;color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;margin-bottom:22px}
.eyebrow::after{content:"";height:1px;width:84px;background:linear-gradient(90deg,rgba(212,175,55,.85),rgba(140,109,79,.35),transparent)}
.eyebrow.sm{margin-bottom:12px;font-size:10px}
.eyebrow.sm::after{display:none}
/* ---------- buttons / chips / prices ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--terra);border-radius:3px;padding:14px 26px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:12px;background:linear-gradient(160deg,#127A3C,#0B5A2B);color:#F2FBEF;transition:.3s;text-decoration:none;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 0 24px rgba(53,194,107,.14)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s var(--ease);z-index:1;pointer-events:none}
.btn:hover::after{transform:translateX(120%)}
.btn:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 0 30px rgba(212,175,55,.22)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(40,6,16,.55);color:var(--ink);border:1px solid #6B5636;box-shadow:none;backdrop-filter:blur(4px)}
.btn.ghost:hover{border-color:var(--gold);color:#FFF5EB}
.btn.ghost::after{background:linear-gradient(105deg,transparent 35%,rgba(212,175,55,.30) 50%,transparent 65%)}
.btn.small{padding:10px 18px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.chip{display:inline-block;background:rgba(232,223,216,.06);border:1px solid var(--line2);color:var(--ink2);border-radius:2px;padding:4px 11px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.price{font-weight:700;color:var(--gold);font-size:19px;letter-spacing:.02em;display:inline-block;transition:transform .3s var(--spring)}
.price.big{font-size:30px}
.oldprice{color:var(--ink3);text-decoration:line-through;font-size:14px;margin-left:6px}
.hero-price{background:var(--gold)!important;color:#241A05!important;border-color:var(--gold);font-weight:700;box-shadow:0 8px 24px rgba(212,175,55,.30)}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:var(--nav);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:1px solid var(--line);transition:box-shadow .3s var(--ease)}
header.scrolled{box-shadow:0 16px 38px rgba(0,0,0,.6);border-bottom-color:var(--line2)}
#scroll-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:200;background:linear-gradient(90deg,var(--terra),var(--gold));transform:scaleX(0);transform-origin:0 50%;will-change:transform}
.nav{display:flex;align-items:center;gap:16px;padding:11px 0}
.logo{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:12px;transition:opacity .25s}
.logo:hover{opacity:.85}
.logo-img{width:46px;height:46px;object-fit:contain;border-radius:50%;background:#F3E9D2;padding:2px;box-shadow:0 0 18px rgba(212,175,55,.25);flex:none}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-text b{font-size:14.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.logo-text span{font-size:9px;font-weight:600;color:var(--gold);letter-spacing:.34em;text-transform:uppercase}
.navlinks{display:flex;gap:6px;margin-left:auto}
.navlinks button{background:none;border:none;padding:9px 13px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);font-size:11px;transition:.25s;position:relative}
.navlinks button::after{content:"";position:absolute;left:13px;right:13px;bottom:3px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s var(--spring)}
.navlinks button:hover{color:#FFF5EB}
.navlinks button:hover::after{transform:scaleX(1)}
.navlinks button.on{color:var(--goldsoft)}
.navlinks button.on::after{transform:scaleX(1)}
.iconbtn{position:relative;background:rgba(232,223,216,.05);border:1px solid var(--line2);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:17px;transition:.25s;color:var(--ink)}
.iconbtn:hover{border-color:var(--gold);transform:translateY(-1px)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--terra);color:#06130A;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
.badge.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.45)}}
.burger{display:none}
button{transition:transform .22s var(--spring),background .28s var(--ease),color .28s var(--ease),border-color .28s var(--ease),box-shadow .3s var(--ease),opacity .25s var(--ease)}
button:active{transform:scale(.96)}
/* ---------- ticker ---------- */
.ticker{background:#24060F;color:var(--gold2);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:8px 0;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.ticker .track{display:inline-block;animation:tick 30s linear infinite;will-change:transform}
@keyframes tick{to{transform:translateX(-50%)}}
/* ---------- CINEMATIC VIDEO HERO ---------- */
.cine-hero{position:relative;height:calc(100svh - 112px);min-height:560px;max-height:920px;overflow:hidden;background:#20040C;display:flex;align-items:center}
.cine-video{position:absolute;inset:0;pointer-events:none}
.cine-video video{position:absolute;inset:0;width:100%;height:100%}
.cine-video .vid-bg{object-fit:cover;object-position:center;transform:scale(1.08);filter:blur(26px) brightness(1.06) saturate(1.25)}
.cine-video .vid-fg{object-fit:contain;object-position:center;filter:saturate(1.08) contrast(1.02)}
.cine-shade-l{position:absolute;inset:0;background:linear-gradient(90deg,rgba(64,10,26,.40) 0%,rgba(64,10,26,.15) 42%,rgba(64,10,26,0) 72%)}
.cine-shade-b{position:absolute;inset:0;background:linear-gradient(to top,rgba(46,6,18,.42),transparent 22%),linear-gradient(to bottom,rgba(46,6,18,.22),transparent 16%)}
.cine-content{position:relative;z-index:3;width:100%}
.cine-main{max-width:660px}
.cine-hero .eyebrow{margin-bottom:14px}
.cine-title{font-size:clamp(72px,11.5vw,138px);line-height:.84;text-transform:uppercase;user-select:none}
.cine-sub{margin:20px 0 0;font-size:11px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:#E8D9C4;text-shadow:0 1px 10px rgba(30,2,10,.65)}
.cine-desc{margin:14px 0 0;font-size:14.5px;font-weight:300;line-height:1.85;color:#EDE0CE;max-width:520px;text-shadow:0 1px 12px rgba(30,2,10,.6)}
.cine-ctas{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px}
.cine-btn{padding:16px 30px}
.cine-price{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:26px}
.cine-deal{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.h-anim{animation:heroUp 1.1s var(--ease-out) both}
.cine-main>*:nth-child(1){animation-delay:.15s}.cine-main>*:nth-child(2){animation-delay:.3s}
.cine-main>*:nth-child(3){animation-delay:.48s}.cine-main>*:nth-child(4){animation-delay:.62s}
.cine-main>*:nth-child(5){animation-delay:.78s}.cine-main>*:nth-child(6){animation-delay:.94s}
@keyframes heroUp{from{opacity:0;transform:translateY(22px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
.cine-watermark{position:absolute;right:34px;bottom:30px;z-index:3;width:104px;height:104px;border-radius:50%;background:rgba(46,6,18,.82);display:grid;place-items:center;box-shadow:0 0 34px rgba(212,175,55,.22);animation:floaty 4.5s ease-in-out infinite}
.cine-watermark img{width:88px;height:88px;border-radius:50%;object-fit:contain;background:#F3E9D2;padding:3px}
@keyframes floaty{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
.cine-scroll{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink2);font-size:9.5px;letter-spacing:.4em;text-transform:uppercase}
.cine-scroll i{display:block;width:1px;height:38px;background:linear-gradient(var(--gold),transparent);animation:scrollPulse 2.2s ease-in-out infinite}
@keyframes scrollPulse{0%,100%{transform:scaleY(.55);opacity:.5}50%{transform:scaleY(1);opacity:1}}
/* ---------- sections ---------- */
section{padding:88px 0 0;position:relative}
.cine-hero{padding:0}
main{padding-bottom:88px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:clamp(42px,5.6vw,66px);text-transform:uppercase;line-height:.92}
.sec-head p{color:var(--ink2);margin:10px 0 0;max-width:580px;font-size:14.5px;line-height:1.8}
.reveal{opacity:0;transform:translateY(30px);filter:blur(4px);transition:opacity .85s var(--ease-out),transform .85s var(--ease-out),filter .85s var(--ease-out);transition-delay:calc(var(--stagger,0)*70ms)}
.reveal.in{opacity:1;transform:none;filter:blur(0)}
.page-enter{animation:pageIn2 .62s var(--ease-out) both}
@keyframes pageIn2{from{opacity:0;transform:translateY(20px) scale(.996);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.card-anim,.gal-anim{animation:cardIn .68s var(--ease-out) both;animation-delay:calc(var(--stagger,0)*70ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
/* ---------- ABOUT / MAKER ---------- */
.cine-about{overflow:hidden}
.about-glow{position:absolute;top:16%;left:-6%;width:30rem;height:30rem;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.10),transparent 65%);pointer-events:none}
.about-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:60px;align-items:center;position:relative;z-index:1}
.cine-h2{font-size:clamp(46px,6vw,76px);line-height:.88;text-transform:uppercase}
.about-bio{color:var(--ink2);font-size:14.5px;line-height:1.9;max-width:560px;margin:24px 0 8px}
.about-bio b{color:var(--goldsoft);font-weight:600}
.cine-quote{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:21px;color:var(--gold2);margin:14px 0 0}
.cine-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border-top:1px solid var(--line2);padding-top:24px;margin-top:28px}
.cine-stats .cs b{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:42px;line-height:1;color:var(--ink);display:block}
.cine-stats .cs:nth-child(even) b{color:var(--gold)}
.cine-stats .cs span{font-size:9.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.maker-wrap{position:relative;max-width:500px;margin:0 auto;width:100%}
.maker-glow{position:absolute;inset:-22px;background:conic-gradient(from 0deg,rgba(212,175,55,.35),rgba(140,109,79,.12) 30%,transparent 60%,rgba(53,194,107,.22));filter:blur(26px);border-radius:20px;pointer-events:none}
.maker-frame{position:relative;padding:13px;border:1px solid var(--line2);background:rgba(46,8,19,.9);box-shadow:0 30px 70px rgba(0,0,0,.8)}
.maker-frame .corner{position:absolute;width:24px;height:24px;z-index:3;pointer-events:none}
.maker-frame .corner.tl{top:-2px;left:-2px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
.maker-frame .corner.tr{top:-2px;right:-2px;border-top:2px solid var(--gold);border-right:2px solid var(--gold)}
.maker-frame .corner.bl{bottom:-2px;left:-2px;border-bottom:2px solid var(--gold);border-left:2px solid var(--gold)}
.maker-frame .corner.br{bottom:-2px;right:-2px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
.maker-frame .ph{position:relative;overflow:hidden;aspect-ratio:4/3;max-height:360px;background:#24060F}
.maker-frame .ph .ph-fg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.06) contrast(1.02)}
.maker-frame .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(46,6,18,.42),transparent 42%)}
.maker-cap{position:absolute;left:16px;bottom:14px;z-index:2;max-width:62%}
.maker-cap span{display:block;font-size:9px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.maker-cap b{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:19px;line-height:1.15;color:#FFF3DF}
/* ---------- SCROLL STACK ---------- */
.stack-wrap{position:relative;padding:8px 0 4vh}
.stack-card{position:sticky;top:calc(92px + var(--i)*15px);margin-bottom:54px;display:grid;grid-template-columns:1.05fr 1fr;background:linear-gradient(150deg,#4A1424,#30091A 70%);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6);transform-origin:top center;will-change:transform,filter;min-height:400px}
.stack-card:last-child{margin-bottom:0}
.stack-media{position:relative;overflow:hidden;min-height:280px;background:#24060F}
.stack-media .sm-fg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.06) contrast(1.02)}
.stack-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,rgba(10,8,5,.35)),linear-gradient(to top,rgba(0,0,0,.28),transparent 45%);pointer-events:none}
.stack-num{position:absolute;left:20px;top:14px;z-index:2;font-family:"Bebas Neue",sans-serif;font-size:64px;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(243,219,179,.85);text-shadow:0 4px 18px rgba(0,0,0,.4)}
.stack-body{padding:42px 40px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.stack-body h3{font-size:clamp(34px,3.6vw,48px);line-height:.92}
.stack-body p{color:var(--ink2);font-size:14.5px;line-height:1.85;margin:6px 0 10px;max-width:440px}
.stack-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.stack-per{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
/* ---------- product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
.pcard{background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s var(--ease);display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:var(--gold2)}
.pcard .ph{position:relative;overflow:hidden;aspect-ratio:4/3;background:#24060F}
.pcard .ph img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .7s var(--ease-out),filter .4s var(--ease)}
.pcard:hover .ph img{transform:scale(1.05);filter:saturate(1.07)}
.pcard .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-130%);transition:transform .7s var(--ease);pointer-events:none;z-index:1}
.pcard:hover .ph::after{transform:translateX(130%)}
.tag{position:absolute;top:10px;left:10px;background:var(--terra-deep);color:#DFF7E6;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:2px;z-index:2;animation:tagIn .5s var(--spring) both;animation-delay:.12s}
.tag.new{background:#0C4A42;color:#CFF5EC}.tag.mine{background:var(--gold);color:#241A05}
@keyframes tagIn{from{opacity:0;transform:translateX(-10px) scale(.8)}to{opacity:1;transform:none}}
.wish{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:rgba(30,4,11,.75);font-size:16px;color:#CBBBA6;display:grid;place-items:center;transition:.25s var(--spring)}
.wish:hover{transform:scale(1.15)}
.wish.on{color:#FF7A70;transform:scale(1.1)}
.quick{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;background:rgba(30,4,11,.9);color:#F3E7CF;border:1px solid var(--line2);border-radius:4px;padding:10px;font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:.3s}
.pcard:hover .quick{opacity:1;transform:none}
.quick:hover{background:var(--terra-deep)}
.pcard .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:7px;flex:1}
.pcard h3{font-size:21px;line-height:1.02}
.pcard .desc{color:var(--ink2);font-size:13px;line-height:1.65;flex:1;font-weight:300}
.stars{color:var(--gold);font-size:13px;letter-spacing:2px}
.stars span{color:var(--ink3);letter-spacing:0;font-size:12px}
.pcard:hover .price{transform:scale(1.07)}
/* ---------- carousel ---------- */
.car{position:relative}
.car-track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 16px;scrollbar-width:none;scroll-behavior:smooth}
.car-track::-webkit-scrollbar{display:none}
.car-track .pcard{min-width:240px;max-width:240px;scroll-snap-align:start}
.car-nav{display:flex;gap:8px}
.car-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(232,223,216,.04);color:var(--ink);font-size:17px}
.car-nav button:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
/* ---------- panels / 3D / video ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:stretch}
.panel{background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.4);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease)}
.panel:hover{transform:translateY(-2px);border-color:var(--line2)}
.panel h3{font-size:26px}
#gl{width:100%;height:300px;border-radius:10px;background:radial-gradient(circle at 50% 35%,#481426,#22060F);display:block;touch-action:none}
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;transition:transform .25s var(--spring)}
.sw:hover{transform:scale(1.15)}
.sw.on{border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
.vidwrap{position:relative;border-radius:12px;overflow:hidden;background:#20040C;border:1px solid var(--line)}
.vidwrap video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.vidbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vidbar button{background:rgba(232,223,216,.05);border:1px solid var(--line2);color:var(--ink2);border-radius:3px;padding:8px 14px;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:.25s}
.vidbar button:hover{transform:translateY(-2px);border-color:var(--gold);color:var(--gold)}
.vidbar button.on{background:var(--terra-deep);color:#EAFBF0;border-color:var(--terra);transform:scale(1.04)}
progress.vp{width:100%;height:6px;appearance:none;margin-top:10px}
progress.vp::-webkit-progress-bar{background:var(--bg2);border-radius:99px}
progress.vp::-webkit-progress-value{background:linear-gradient(90deg,var(--terra),var(--gold));border-radius:99px;transition:width .25s linear}
progress.vp::-moz-progress-bar{background:var(--gold);border-radius:99px}
/* ---------- steps / testimonials ---------- */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;transition:transform .35s var(--ease),border-color .35s var(--ease)}
.step:hover{transform:translateY(-4px);border-color:var(--gold2)}
.step .n{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold2);display:grid;place-items:center;font-family:"Bebas Neue",sans-serif;color:var(--gold);font-size:20px;margin-bottom:12px}
.step h3{font-size:22px}
.testi{position:relative;min-height:170px}
.tst{position:absolute;inset:0;opacity:0;transform:translateX(24px);transition:.6s var(--ease);pointer-events:none;padding:24px}
.tst.on{opacity:1;transform:none;pointer-events:auto;position:relative}
.tst blockquote{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(21px,2.8vw,27px);font-weight:500;line-height:1.45;margin:0 0 12px;color:var(--ink)}
/* ---------- shop toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input[type=search]{flex:1;min-width:180px;padding:13px 18px;border-radius:4px;border:1px solid var(--line2);background:#2E0A15;color:var(--ink);transition:border-color .25s,box-shadow .25s}
.toolbar input[type=search]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.14)}
.toolbar select{padding:13px 16px;border-radius:4px;border:1px solid var(--line2);background:#2E0A15;color:var(--ink);font-weight:600;transition:border-color .25s}
.catbtn{border:1px solid var(--line2);background:rgba(232,223,216,.04);color:var(--ink2);border-radius:3px;padding:10px 17px;font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:.28s var(--ease)}
.catbtn:hover{transform:translateY(-2px);border-color:var(--gold);color:var(--gold)}
.catbtn.on{background:var(--ink);color:#14100A;border-color:var(--ink)}
.catbtn:active{transform:scale(.94)}
/* ---------- double-sided 3D viewer ---------- */
.tilt-stage{perspective:1300px;border-radius:12px;background:radial-gradient(circle at 50% 35%,#481426,#22060F);padding:16px 14px 14px;overflow:hidden;position:relative;border:1px solid var(--line)}
.tilt-zoom{transition:transform .4s var(--ease-out)}
.card3d-scene{width:100%;max-width:330px;margin:0 auto;aspect-ratio:1/1;perspective:1300px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.card3d-scene:active{cursor:grabbing}
.card3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;will-change:transform}
.card3d.anim{transition:transform .85s cubic-bezier(.2,.8,.25,1)}
.edge3d{position:absolute;inset:-5px;border-radius:14px;background:linear-gradient(135deg,#A9853F,#D8BC7A 45%,#8F6E33);transform:translateZ(0);box-shadow:0 26px 46px rgba(0,0,0,.6)}
.face3d{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;background:#EFE8D0;transform:translateZ(2px)}
.face3d img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;pointer-events:none}
.face3d.back{transform:rotateY(180deg) translateZ(2px)}
.face3d.back img{transform:scaleX(-1);filter:brightness(.94) saturate(1.03) sepia(.08)}
.face3d.back::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(90,60,20,.05) 0 6px,transparent 6px 12px);pointer-events:none}
.side-tag{position:absolute;top:10px;left:10px;z-index:3;background:var(--terra-deep);color:#fff;font-size:10px;font-weight:700;letter-spacing:1.4px;padding:5px 10px;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.side-tag.back-tag{background:var(--gold);color:#241A05}
.back-note{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:rgba(34,5,13,.92);color:#F3E7CF;font-size:12.5px;font-weight:600;text-align:center;padding:7px 10px;border-radius:6px}
.side-pill{position:relative;z-index:4;width:fit-content;margin:0 auto 12px;background:#24060F;border:1px solid var(--gold2);color:var(--goldsoft);font-size:10.5px;font-weight:700;letter-spacing:1.6px;padding:6px 14px;border-radius:999px;text-align:center;animation:pillIn .35s var(--ease) both}
@keyframes pillIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.flipbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;position:relative;z-index:4}
.qv3d{display:flex;flex-direction:column;height:100%;background:radial-gradient(circle at 50% 35%,#481426,#22060F);padding:14px;perspective:1300px}
.qv3d .card3d-scene{flex:none;width:100%;max-width:380px;aspect-ratio:1/1;min-height:0;margin:0 auto}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.thumbs button{width:46px;height:46px;border-radius:8px;overflow:hidden;border:2.5px solid var(--line2);padding:0;background:var(--card);transition:.25s}
.thumbs button:hover{transform:scale(1.1)}
.thumbs button.on{border-color:var(--gold);transform:scale(1.08)}
.thumbs img{width:100%;height:100%;object-fit:cover;object-position:center}
/* ---------- galleries ---------- */
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.galgrid figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s var(--ease)}
.galgrid figure:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--line2)}
.galgrid figure div{overflow:hidden;aspect-ratio:4/3;position:relative;background:#24060F}
.galgrid img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .7s var(--ease-out)}
.galgrid figure:hover img{transform:scale(1.05)}
.galgrid figcaption{padding:11px 14px;font-weight:600;font-size:13.5px;transition:background .35s}
.galgrid figure:hover figcaption{background:var(--bg2)}
.gal-price{display:block;color:var(--gold);font-weight:700;font-size:14px;margin-top:3px}
.lookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.lookgrid figure{margin:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card);transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s var(--ease)}
.lookgrid figure:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--line2)}
.lookgrid figure div{overflow:hidden;aspect-ratio:4/3;position:relative;background:#24060F}
.lookgrid img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .7s var(--ease-out)}
.lookgrid figure:hover img{transform:scale(1.05)}
.lookgrid figcaption{padding:11px 14px;font-weight:600;font-size:13px;transition:background .35s}
.lookgrid figure:hover figcaption{background:var(--bg2)}
.lookgrid figcaption span{display:block;font-weight:400;color:var(--ink2);font-size:12px;margin-top:2px}
.look-price-badge{position:absolute;top:9px;left:9px;z-index:3;background:var(--gold);color:#241A05;font-weight:800;font-size:13px;padding:5px 11px;border-radius:2px;box-shadow:0 6px 16px rgba(0,0,0,.45);animation:pricePop .5s var(--spring) both;animation-delay:calc(var(--stagger,0)*70ms + .15s)}
@keyframes pricePop{from{opacity:0;transform:scale(.6) translateY(-5px)}to{opacity:1;transform:scale(1) translateY(0)}}
.look-foot{display:flex!important;align-items:center;justify-content:space-between;gap:8px;margin-top:8px!important}
.look-foot .price{font-size:19px}
.look-add{padding:8px 13px!important;font-size:10.5px!important;white-space:nowrap}
/* ---------- deals ---------- */
.dealgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:18px;margin-top:14px}
.deal-card{position:relative;background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:12px;padding:26px 18px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s var(--ease)}
.deal-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--line2)}
.deal-card.best{border:1.5px solid var(--gold);box-shadow:0 18px 40px rgba(212,175,55,.16)}
.deal-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:#241A05;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:2px;white-space:nowrap;z-index:2}
.deal-badge.pop{background:var(--terra);color:#06130A}
.deal-card img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--line2);transition:transform .5s var(--spring)}
.deal-card:hover img{transform:scale(1.13) rotate(-4deg)}
.deal-pc{font-family:"Bebas Neue",sans-serif;font-size:52px;line-height:1;color:var(--ink)}
.deal-pc span{display:block;font-family:"Montserrat",sans-serif;font-size:11px;font-weight:600;color:var(--ink2);letter-spacing:.24em;text-transform:uppercase;margin-top:4px}
.deal-price{font-size:27px;font-weight:800;color:var(--gold)}
.deal-per{color:var(--ink2);font-size:13px;font-weight:500}
.deal-save{background:rgba(53,194,107,.12);color:var(--sage);font-weight:700;font-size:12px;border-radius:2px;padding:5px 12px}
.deal-card .sp{flex:1;min-height:6px}
.deal-card .btn{width:100%;justify-content:center}
/* ---------- brand strip ---------- */
.brand-hero{display:flex;gap:24px;align-items:center;background:linear-gradient(150deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:14px;padding:24px 28px;box-shadow:0 18px 40px rgba(0,0,0,.4);flex-wrap:wrap}
.brand-hero img{width:140px;height:140px;object-fit:contain;border-radius:50%;background:#F3E9D2;padding:4px;flex:none;box-shadow:0 0 26px rgba(212,175,55,.18)}
.brand-hero h2{font-size:clamp(34px,4vw,48px);margin-bottom:6px}
.brand-hero p{color:var(--ink2);margin:0;max-width:560px;font-size:14.5px;line-height:1.8}
/* ---------- drawer / modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,2,8,.66);z-index:80;opacity:0;pointer-events:none;transition:opacity .38s var(--ease);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}
.overlay.on{opacity:1;pointer-events:auto;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);background:#2A0813;z-index:90;transform:translateX(105%);transition:transform .52s var(--ease-out);display:flex;flex-direction:column;box-shadow:-18px 0 44px rgba(0,0,0,.6);border-left:1px solid var(--line2)}
.drawer.on{transform:none}
.drawer header{position:static;background:#2A0813;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.drawer .items{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.drawer.on .citem{animation:drawerItem .5s var(--ease-out) both}
.drawer.on .citem:nth-child(2){animation-delay:.05s}.drawer.on .citem:nth-child(3){animation-delay:.1s}.drawer.on .citem:nth-child(4){animation-delay:.15s}.drawer.on .citem:nth-child(5){animation-delay:.2s}
@keyframes drawerItem{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.citem{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;transition:transform .25s var(--ease)}
.citem:hover{transform:translateX(-2px)}
.citem img{width:66px;height:66px;border-radius:8px;object-fit:cover;object-position:center;flex:none}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.qty button{width:28px;height:28px;border:none;background:var(--bg2);color:var(--ink);font-weight:800}
.qty button:active{transform:scale(.85)}
.qty b{min-width:26px;text-align:center}
.drawer .foot{border-top:1px solid var(--line);padding:16px 18px;background:var(--card);animation:drawerFoot .45s var(--ease-out) both}
@keyframes drawerFoot{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;pointer-events:none;animation:fadeIn .28s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal .box{background:#33091A;border:1px solid var(--line2);border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;opacity:0;transform:translateY(24px) scale(.98);transition:opacity .35s var(--ease),transform .45s var(--spring);pointer-events:none;box-shadow:var(--shadow)}
.modal.on .box{opacity:1;transform:none;pointer-events:auto}
.modal.on{pointer-events:auto}
.qv{display:grid;grid-template-columns:1fr 1fr;gap:0}
.qv .info{padding:24px}
.qv .info>*{animation:qvInfo .55s var(--ease-out) both}
.qv .info>*:nth-child(2){animation-delay:.06s}.qv .info>*:nth-child(3){animation-delay:.12s}.qv .info>*:nth-child(4){animation-delay:.18s}.qv .info>*:nth-child(5){animation-delay:.24s}.qv .info>*:nth-child(6){animation-delay:.3s}.qv .info>*:nth-child(7){animation-delay:.36s}
@keyframes qvInfo{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,92vw);pointer-events:none}
.toast .btn{pointer-events:auto}
.toast{background:var(--ink);color:#171208;padding:12px 18px;border-radius:6px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:toastIn .42s var(--spring) both;display:flex;gap:10px;align-items:center;width:100%;justify-content:space-between}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
/* ---------- checkout ---------- */
.co{display:grid;grid-template-columns:1.25fr .85fr;gap:24px;align-items:start}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line2);border-radius:6px;background:#2E0A15;color:var(--ink);transition:border-color .25s,box-shadow .25s}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,175,55,.13)}
.field .err{color:#FF8A80;font-size:12.5px;font-weight:600;margin-top:4px}
.field input.bad{border-color:#C0392B}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.payopt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line2);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:.28s var(--ease);width:100%;text-align:left;color:var(--ink)}
.payopt:hover{transform:translateX(4px);border-color:var(--gold2)}
.payopt.on{border-color:var(--terra);background:var(--bg2)}
.payopt .ic{font-size:24px}
.ccard{background:linear-gradient(120deg,#07270F,#0E7A3D 130%);color:#FFEFD8;border-radius:14px;padding:20px 22px;margin:6px 0 16px;box-shadow:var(--shadow);border:1px solid rgba(212,175,55,.35)}
.ccard .num{font-size:clamp(19px,4.4vw,25px);letter-spacing:2.5px;font-weight:700;font-variant-numeric:tabular-nums;margin:16px 0 12px;min-height:32px}
.ccard small{opacity:.75;font-size:10px;letter-spacing:1.8px;display:block}
.summary{background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:22px;position:sticky;top:96px}
.srow{display:flex;justify-content:space-between;padding:7px 0;font-size:15px}
.srow.total{border-top:1px dashed var(--line2);margin-top:8px;padding-top:13px;font-weight:800;font-size:18px}
.freebar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.freebar i{display:block;height:100%;background:linear-gradient(90deg,var(--terra),var(--gold));border-radius:99px;transition:width .6s var(--ease-out)}
.success{text-align:center;padding:36px 10px}
.success .tick{width:84px;height:84px;border-radius:50%;background:var(--terra);color:#06130A;font-size:42px;display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s ease}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:130;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg)}}
.countdown{display:flex;gap:10px}
.countdown div{background:#2E0A15;border:1px solid var(--line2);color:var(--ink);border-radius:8px;min-width:64px;text-align:center;padding:10px 4px;transition:transform .25s var(--ease)}
.countdown div:hover{transform:translateY(-2px)}
.countdown b{font-size:26px;display:block;font-family:"Bebas Neue",sans-serif;font-weight:400;line-height:1}
.countdown span{font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;opacity:.7}
/* ---------- footer ---------- */
footer{margin-top:0;background:#1E040B;border-top:1px solid var(--line2);color:#CBBBAA;padding:56px 0 28px}
footer a{color:#CBBBAA;text-decoration:none;display:inline-block;transition:transform .3s var(--ease),color .3s var(--ease)}
footer a:hover{transform:translateX(5px);color:var(--gold)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:28px}
footer h4{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:24px;letter-spacing:.06em;margin:0 0 12px;color:#FFF5EB;text-transform:uppercase}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;font-weight:300}
.footer-logo{width:84px;height:84px;object-fit:contain;border-radius:50%;background:#F3E9D2;padding:4px;margin-bottom:14px}
.fab{position:fixed;right:16px;bottom:16px;z-index:70;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold2);background:#33091A;color:var(--gold);font-size:19px;box-shadow:var(--shadow);transition:all .4s var(--spring);animation:fabIn .5s var(--ease-out) both}
@keyframes fabIn{from{opacity:0;transform:translateY(14px) scale(.85)}to{opacity:1;transform:none}}
.fab:hover{transform:translateY(-3px) scale(1.07);border-color:var(--gold)}
/* ---------- policy pages ---------- */
.pol{max-width:880px}
.pol h3{font-family:"Bebas Neue",sans-serif;font-weight:400;font-size:25px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin:28px 0 8px}
.pol h3:first-child{margin-top:0}
.pol p{color:var(--ink2);margin:0 0 10px;font-size:15px;line-height:1.85}
.pol ul{color:var(--ink2);margin:0 0 12px;padding-left:20px;display:grid;gap:6px;font-size:15px;line-height:1.8}
.pol b{color:var(--goldsoft);font-weight:600}
.contact-rows{display:grid;gap:12px;margin-top:8px}
.contact-row{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.contact-row .ic{font-size:22px;line-height:1.25}
.contact-row b{display:block;font-size:15px}
.contact-row span{color:var(--ink2);font-size:14px;line-height:1.7}
.contact-row a{color:var(--gold2);text-decoration:none;font-weight:600}
.contact-row a:hover{color:var(--gold)}
/* story page side photos */
.split-img{width:100%;height:100%;min-height:260px;object-fit:cover;border-radius:14px}
/* ---------- responsive ---------- */
@media (max-width:1020px){ .about-grid{grid-template-columns:1fr;gap:44px} .maker-wrap{max-width:500px} }
@media (max-width:900px){ .split,.co,.qv{grid-template-columns:1fr} .summary{position:static} .stack-card{grid-template-columns:1fr;min-height:0} .stack-media{min-height:230px} .stack-body{padding:28px 24px 32px} }
@media (max-width:640px){
  .navlinks{display:none;position:absolute;top:100%;left:0;right:0;background:#24060F;border-bottom:1px solid var(--line2);flex-direction:column;padding:12px 16px 18px;gap:2px}
  .navlinks.open{display:flex;animation:menuSlide .34s var(--ease-out) both}
